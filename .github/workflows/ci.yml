name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Package.swift needs swift-tools-version 6.2 (Xcode 26), which needs macOS 15.6+, so macos-14 cannot build it.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        # macos-15 defaults to Xcode 16; pick the newest Xcode 26 the image ships.
        if: matrix.os == 'macos-15'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          scripts/make-app.sh .build/release/LockedInApp build/LockedIn.app
          codesign --verify --strict build/LockedIn.app
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        # --strict turns warnings into a failing exit code; without it lint never fails the job.
        run: swift format lint --strict --recursive Sources Tests
